name: ffmpeg-agent

services:
  media:
    image: ${MEDIA_IMAGE:-ffmpeg-agent:v1-local}
    build:
      context: ..
      args:
        BUILD_REVISION: ${BUILD_REVISION:-local}
    init: true
    user: "10001:10001"
    restart: unless-stopped
    stop_grace_period: 60s
    ports:
      - "${MEDIA_BIND_ADDRESS:-127.0.0.1}:${MEDIA_PORT:-8080}:8080"
    environment:
      MEDIA_CONFIG_FILE: /run/secrets/media-config.json
      MEDIA_SERVICE_TOKEN: ${MEDIA_SERVICE_TOKEN:?请先运行 python3 deploy/generate-config.py 初始化 .env}
      MEDIA_PUBLIC_BASE_URL: ${MEDIA_PUBLIC_BASE_URL:-http://localhost:8080}
      MEDIA_LLM_ENABLED: ${MEDIA_LLM_ENABLED:-false}
      MEDIA_A2A_ENABLED: ${MEDIA_A2A_ENABLED:-false}
      MEDIA_LLM_API_KEY: ${MEDIA_LLM_API_KEY:-}
      MEDIA_LLM_MODEL: ${MEDIA_LLM_MODEL:-}
      MEDIA_LLM_BASE_URL: ${MEDIA_LLM_BASE_URL:-}
      MEDIA_LLM_OUTPUT_MODE: ${MEDIA_LLM_OUTPUT_MODE:-prompted}
      MEDIA_PLANNING_TIMEOUT_SECONDS: ${MEDIA_PLANNING_TIMEOUT_SECONDS:-60}
      MEDIA_PLANNING_CONCURRENCY: ${MEDIA_PLANNING_CONCURRENCY:-2}
      MEDIA_PLANNING_MAX_OUTPUT_TOKENS: ${MEDIA_PLANNING_MAX_OUTPUT_TOKENS:-4096}
      MEDIA_MAX_AGENT_REQUESTS: ${MEDIA_MAX_AGENT_REQUESTS:-32}
    secrets:
      - source: media_config
        target: media-config.json
    volumes:
      - state:/var/lib/ffmpeg-agent/state
      - work:/var/lib/ffmpeg-agent/work
      - shared_input:/media/input:ro
      - shared_output:/media/output
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,uid=10001,gid=10001,mode=0700
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health/ready', timeout=2).close()"]
    cpus: "2.0"
    mem_limit: 2g
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

secrets:
  media_config:
    file: ${MEDIA_CONFIG_PATH:-./local/media-config.json}

volumes:
  state:
  work:
  shared_input:
  shared_output:
