[project]
name = "ffmpeg-agent"
version = "0.1.0"
description = "单容器媒体处理服务"
requires-python = ">=3.14,<3.15"
dependencies = [
  "fastapi==0.143.0",
  "pydantic==2.14.1",
  "pydantic-settings==2.15.0",
  "uvicorn==0.54.0",
  "aiosqlite==0.22.1",
  "aiohttp==3.14.5",
  "pillow==12.3.0",
  "mcp==2.1.0",
  "python-multipart==0.0.22",
  "pydantic-ai-slim[openai]==2.56.0",
  "a2a-sdk[http-server]==1.2.2",
]

[dependency-groups]
dev = [
  "ruff==0.17.0",
  "pyright==1.1.414",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "httpx==0.28.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "ASYNC"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.14"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
